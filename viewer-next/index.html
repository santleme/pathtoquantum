<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path to Quantum — viewer</title>
<style>
  :root { --bg:#0b1020; --panel:#131a2e; --ink:#e8ecf6; --dim:#8b96b8; --line:#26304d; --gold:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace; }
  header { display:flex; gap:14px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  header .date { color:var(--gold); font-size:15px; }
  button, select { background:#1c2742; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  input[type=range] { flex:1; accent-color:var(--gold); min-width:120px; }
  main { display:grid; grid-template-columns: 1fr 380px; height: calc(100vh - 54px); }
  #mapwrap { position:relative; padding:10px; }
  #mapwrap canvas { position:absolute; inset:10px; width:calc(100% - 20px); height:calc(100% - 20px);
    background:#0d1526; border:1px solid var(--line); border-radius:8px; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:0 14px 14px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:14px 0 6px; }
  .row { display:grid; grid-template-columns:12px 1fr auto; gap:8px; align-items:center; padding:5px 0;
    border-bottom:1px dashed #22304f; font-size:12.5px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .row .cash { color:#9ae6b4; }
  .row.dead { opacity:.45; }
  .stage { color:var(--dim); font-size:11px; }
  #err { color:#ff8fa3; padding:8px 16px; display:none; }
  .legend { font-size:11px; color:var(--dim); padding:6px 2px; }
  @media (max-width: 1023px) { main { grid-template-columns: 1fr; height:auto; } #mapwrap { height: 60vh; } aside { border-left:none; } }
</style>
</head>
<body>
<header>
  <h1>🌎 PATH TO QUANTUM</h1>
  <span class="date" id="date">—</span>
  <button id="play">⏸ pausar</button>
  <label>velocidade
    <select id="speed"><option value="1400">lenta</option>
      <option value="700" selected>normal</option><option value="250">rápida</option>
      <option value="60">deus apressado</option></select></label>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="scrub do replay">
</header>
<div id="err" role="alert"></div>
<main>
  <div id="mapwrap">
    <canvas id="base"></canvas>
    <canvas id="dyn"></canvas>
    <canvas id="flow"></canvas>
  </div>
  <aside>
    <h2>Placar das empresas</h2>
    <div id="board"></div>
    <div class="legend" id="legend"></div>
    <h2>Crônica (últimos eventos)</h2>
    <div id="feed"></div>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
