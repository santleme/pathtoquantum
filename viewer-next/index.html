<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path to Quantum — viewer</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">
<style>
  :root { --bg:#0b1020; --panel:#131a2e; --ink:#e8ecf6; --dim:#8b96b8; --line:#26304d; --gold:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-monospace, Menlo, Consolas, monospace;
    display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:14px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.04em; }
  /* Lockup (F5, VIS-09): marca derivada da capa + nome + tagline no header */
  .brand { display:flex; gap:9px; align-items:center; }
  .brand img { width:34px; height:34px; border-radius:7px; border:1px solid var(--line); }
  .brand .bname { display:flex; flex-direction:column; gap:0; }
  .brand .tagline { font-size:10.5px; color:var(--dim); letter-spacing:.01em; max-width:340px; line-height:1.25; }
  /* Legenda viva (F5, VIS-09): empresas do frame + símbolos/tiers explicados */
  .legend .lg-note { margin:2px 0; font-size:10.5px; }
  .legend .lg-company { display:inline-flex; gap:5px; align-items:center; margin:1px 8px 1px 0; color:var(--ink); font-size:11.5px; }
  .legend .lg-line { margin:2px 0; display:flex; gap:6px; align-items:center; }
  .legend .lg-glyph { color:var(--gold); }
  .legend .lg-tier.tier-marco { color:var(--gold); }
  .legend .lg-tier.tier-estrutural { color:#7ea8d8; }
  header .date { color:var(--gold); font-size:15px; }
  button, select { background:#1c2742; color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; }
  input[type=range] { flex:1; accent-color:var(--gold); min-width:120px; }
  /* Lentes (F3, VIS-05) */
  #lenses { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .lens-btn { font-size:12px; }
  .lens-btn.active { border-color:var(--gold); color:var(--gold); font-weight:bold; }
  .lens-btn .soon { font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  #lensnote { font-size:11.5px; color:var(--gold); }
  main { display:grid; grid-template-columns: 1fr 380px; flex:1; min-height:0; }
  /* Barra da cadeia (F4, VIS-06): sempre visível sob o header */
  #chainbar { padding:8px 16px; border-bottom:1px solid var(--line); background:#0d1526; }
  .csegs { display:flex; gap:6px; align-items:stretch; flex-wrap:wrap; }
  .cseg { flex:1; min-width:150px; border:1px solid var(--line); border-radius:6px; padding:5px 8px;
    display:flex; flex-direction:column; gap:2px; font-size:11.5px; background:var(--panel); }
  .cseg .clabel { font-weight:bold; }
  .cseg.dominado { border-color:#8a6d1f; background:#1a2238; }
  .cseg.dominado .clabel { color:var(--gold); }
  .cseg.em-disputa { border-color:var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .cwho { display:inline-flex; gap:5px; align-items:center; }
  .cwho.dim { color:var(--dim); }
  .cwho .dot { width:8px; height:8px; }
  .carrow { align-self:center; color:var(--dim); }
  .cmarket { margin-top:6px; font-size:11.5px; color:var(--dim); }
  .tag-front { color:#0b1020; background:#7ea8d8; border-color:#7ea8d8; font-weight:bold; align-self:flex-start; }
  /* Vista-cadeia Sankey + equivalência textual (F4, VIS-06/10) */
  .sankey { display:block; }
  .snode.dominado { fill:#c9a227; }
  .snode.aberto { fill:#26304d; stroke:#3b4a73; }
  .slink { fill:none; stroke:#7ea8d8; stroke-opacity:.45; }
  .slabel { fill:var(--ink); font-size:8.5px; }
  .sval { fill:var(--gold); font-size:8px; font-weight:bold; }
  .snote { fill:var(--dim); font-size:10px; }
  .chain-list { font-size:11.5px; color:var(--dim); padding-left:16px; margin:6px 0; line-height:1.5; }
  .chain-list b { color:var(--ink); }
  /* Painel de seleção (F3/F4): progresso + estoques da empresa selecionada */
  #selpanel { font-size:12.5px; }
  #selpanel .dim-note { color:var(--dim); font-size:11.5px; line-height:1.45; margin:0; }
  .selhead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .selmeta { margin-top:3px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .selcash { color:#9ae6b4; }
  .selstocks h3 { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin:9px 0 4px; }
  .selstocks ul { list-style:none; padding:0; margin:0; }
  .selstocks li { display:flex; justify-content:space-between; gap:8px; padding:2.5px 0; border-bottom:1px dashed #22304f; }
  .selstocks .samt { color:var(--gold); }
  .selstocks.dim, .selstocks .dim { color:var(--dim); }
  #mapwrap { position:relative; padding:10px; }
  #mapwrap canvas { position:absolute; inset:10px; width:calc(100% - 20px); height:calc(100% - 20px);
    background:#0d1526; border:1px solid var(--line); border-radius:8px; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; padding:0 14px 14px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:14px 0 6px; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .stage { color:var(--dim); font-size:11px; }
  /* Placar-ranking (F3, VIS-08): posição, segmentos de elo, Δ de caixa, seleção/falida */
  .brow { display:grid; grid-template-columns:22px 12px 1fr auto auto; gap:8px; align-items:center; width:100%;
    text-align:left; background:transparent; border:none; border-bottom:1px dashed #22304f; border-radius:0;
    padding:6px 4px; color:var(--ink); font:inherit; font-size:12.5px; cursor:pointer; }
  .brow:hover, .brow:focus-visible { background:#1a2440; outline:1px solid var(--line); }
  .brow .pos { color:var(--dim); font-weight:bold; }
  .brow .bmain { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .brow .bcash { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
  .brow .cash { color:#9ae6b4; }
  .brow.selected { background:#182238; box-shadow: inset 3px 0 0 var(--gold); }
  .brow.dead { opacity:.55; }
  .brow.dead .bname { text-decoration: line-through; }
  .segs { display:inline-flex; gap:2.5px; }
  .segs .seg { width:14px; height:5px; background:#26304d; border-radius:2px; }
  .segs .seg.on { background:var(--gold); }
  .delta { font-size:11px; }
  .delta.up { color:#9ae6b4; }
  .delta.down { color:#ff8fa3; }
  .delta.flat, .delta.none { color:var(--dim); }
  .tag-sel { color:#0b1020; background:var(--gold); border-color:var(--gold); font-weight:bold; }
  .tag-dead { color:#ff8fa3; border-color:#ff8fa3; font-weight:bold; }
  #err { color:#ff8fa3; padding:8px 16px; display:none; }
  .legend { font-size:11px; color:var(--dim); padding:6px 2px; }
  /* Feed da crônica (F2, VIS-03/04): hierarquia por tier, selo por kind, marca de novo */
  #feedmeta { font-size:11px; color:var(--dim); margin:0 0 6px; }
  .feed-item { display:flex; gap:8px; width:100%; text-align:left; align-items:flex-start;
    background:transparent; border:none; border-left:3px solid var(--line); border-bottom:1px dashed #22304f;
    border-radius:0; padding:6px 6px 6px 8px; color:var(--ink); font:inherit; font-size:12.5px; cursor:pointer; }
  .feed-item:hover, .feed-item:focus-visible { background:#1a2440; outline:1px solid var(--line); }
  .feed-item .kicon-wrap { flex:0 0 auto; margin-top:1px; color:var(--dim); }
  .feed-item .kicon { width:16px; height:16px; display:block; }
  .feed-item .fbody { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .feed-item .fmeta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .feed-item .fdate { color:var(--dim); font-size:11.5px; }
  .feed-item .ftext { line-height:1.35; }
  .tag { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);
    border:1px solid var(--line); border-radius:999px; padding:0 6px; }
  .tag-new { color:#0b1020; background:var(--gold); border-color:var(--gold); font-weight:bold; }
  .chip { display:inline-flex; gap:5px; align-items:center; font-size:11.5px; color:var(--ink); }
  .chip .dot { width:9px; height:9px; }
  .chip .dot.hollow { background:transparent; border:1.5px solid var(--dim); border-radius:50%; }
  .feed-item.tier-marco { border-left:4px solid var(--gold); background:#182238; }
  .feed-item.tier-marco .fdate { color:var(--gold); }
  .feed-item.tier-marco .ftext { font-weight:bold; }
  .feed-item.tier-marco .kicon-wrap { color:var(--gold); }
  .feed-item.tier-estrutural { border-left-color:#7ea8d8; }
  .feed-item.tier-estrutural .kicon-wrap { color:#7ea8d8; }
  .feed-item.tier-fundacao .kicon-wrap { color:#9ae6b4; }
  .feed-item.tier-rotina { font-size:12px; }
  .feed-item.tier-rotina .ftext { color:#c3cbdf; }
  .feed-item.is-new { animation: feed-pulse 1.1s ease-in-out 3; }
  @keyframes feed-pulse { 0%,100% { box-shadow: inset 0 0 0 0 rgba(255,209,102,0); } 50% { box-shadow: inset 0 0 0 2px rgba(255,209,102,.75); } }
  @media (prefers-reduced-motion: reduce) { .feed-item.is-new { animation: none; } }
  @media (max-width: 1023px) { body { height:auto; } main { grid-template-columns: 1fr; flex:none; } #mapwrap { height: 60vh; } aside { border-left:none; } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="/ptq-mark-64.png" alt="" width="34" height="34">
    <div class="bname">
      <h1>Path to Quantum</h1>
      <span class="tagline">Eight autonomous AI companies. One real Earth. A race from raw ore to the quantum computer — and you are its god.</span>
    </div>
  </div>
  <span class="date" id="date">—</span>
  <button id="play">⏸ pausar</button>
  <label>velocidade
    <select id="speed"><option value="1400">lenta</option>
      <option value="700" selected>normal</option><option value="250">rápida</option>
      <option value="60">deus apressado</option></select></label>
  <input type="range" id="scrub" min="0" max="0" value="0" aria-label="scrub do replay">
  <nav id="lenses" aria-label="Lentes do mapa"></nav>
  <span id="lensnote" role="status"></span>
</header>
<div id="err" role="alert"></div>
<section id="chainbar" aria-label="Progresso da cadeia rumo ao supercomputador"></section>
<main>
  <div id="mapwrap">
    <canvas id="base"></canvas>
    <canvas id="dyn"></canvas>
    <canvas id="flow"></canvas>
  </div>
  <aside>
    <h2>Placar das empresas</h2>
    <div id="board"></div>
    <h2>Legenda — lente ativa</h2>
    <div class="legend" id="legend"></div>
    <h2>Empresa selecionada</h2>
    <div id="selpanel"></div>
    <h2>Vista da cadeia</h2>
    <div id="sankey"></div>
    <h2>Crônica</h2>
    <p id="feedmeta"></p>
    <div id="feed"></div>
  </aside>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
