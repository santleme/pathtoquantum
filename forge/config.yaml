# Forja de políticas-código do Path to Quantum (Degrau 2, épica #1).
# Uso (no Kaggle, nunca na VM):
#   python openevolve-run.py forge/seed_policy.py forge/evaluator.py \
#       --config forge/config.yaml --iterations 300
max_iterations: 300
checkpoint_interval: 25

# Ensemble barato com teto executado por max_iterations: primário
# rápido/barato na maioria das mutações, forte como tempero.
# Trocar os modelos por qualquer endpoint OpenAI-compatible.
llm:
  primary_model: "gemini-2.5-flash-lite"
  primary_model_weight: 0.8
  secondary_model: "gemini-2.5-flash"
  secondary_model_weight: 0.2
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.7
  max_tokens: 16000
  timeout: 180

prompt:
  system_message: >
    You are evolving the decision policy of ONE autonomous company in a
    simulated world economy (Path to Quantum). The program defines
    EvolvedPolicy.decide(engine, comp); everything else is inherited
    from the baseline heuristic and may be overridden inside the
    EVOLVE-BLOCK (reserve, pick_deposit, build_downstream, plan_buys,
    buffer, plan_sells, use_tools). Companies prospect and mine
    deposits, refine, build factories/plants/assembly up a production
    chain toward supercomputers, buy missing inputs, sell surplus and
    buy marketing tools. Fitness is the tournament index S (cash
    percentile 50%, chain stage 30%, supercomputers 20%) of your
    company invading a frozen field of rivals. LEGAL information only:
    what the company probed (comp.knowledge), its own cash/stocks/
    facilities/traits, and public prices via engine. A guard rejects
    programs that import outside the allowlist (mundo, math), call
    eval/open/getattr, touch engine.rng or engine.companies, or assign
    attributes on engine/comp — rejected programs score 0 and the
    violations come back as artifacts. Prefer strategies a human can
    read and name: legibility is a product requirement, not style.
    Read the block summary and chronicle highlights in the artifacts:
    they tell the story of why the parent won or lost each world.

database:
  population_size: 300
  archive_size: 100
  num_islands: 5
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  # Eixos comportamentais do MAP-Elites (métricas do avaliador):
  # profundidade vertical média e expansão física média — espécies
  # diferentes ocupam células diferentes do arquivo.
  feature_dimensions: ["stage_mean", "facilities_mean"]

evaluator:
  timeout: 1200
  cascade_evaluation: true
  # S de tela (stage1) para merecer o stage2 completo:
  cascade_thresholds: [0.45]
  parallel_evaluations: 4

diff_based_evolution: true
max_code_length: 40000
