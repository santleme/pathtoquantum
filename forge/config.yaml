# Forja de políticas-código do Path to Quantum (Degrau 2, épica #1).
# Uso (no Kaggle, nunca na VM):
#   python openevolve-run.py forge/seed_policy.py forge/evaluator.py \
#       --config forge/config.yaml --iterations 300
max_iterations: 300
checkpoint_interval: 25
# Fronteira do que evolui: edições do LLM fora do EVOLVE-BLOCK são
# revertidas (revisão do PR #7 — sem isto o default é False).
enforce_evolve_blocks: true

# Portão da sonda DENTRO da corrida (emenda pós-V8, branch
# forja/portao-sonda): run_forge sonda as rotas antes da iteração
# 0 e se recusa a largar (FORGE-GATE: BLOCKED) sem
# nvidia/nvidia/nemotron-3-ultra-550b-a55b vivo + ≥1 rota Gemini
# viva; as rotas
# mortas são podadas da cadeia da corrida. Default LIGADO.
# Desligar — só para smokes/testes antigos: forge/run.py
# --no-probe-gate ou run_forge(probe_gate=False).
probe_gate: true

# Porte ShinkaEvolve (issue #21, estudo docs/ESTUDO-SHINKA-FORJA.md)
# em staging: técnicas 1 (pais) e 2 (novidade Tier 1) atrás de
# flags, DESLIGADAS por padrão — ativação só pós-veredito da
# corrida #6, por decisão do fundador. Com as flags desligadas, a
# corrida é bit-idêntica à atual (seleção, RNG e resultados).
# Pais: weighted = σ(λ·(F−mediana)) × 1/(1+N filhos gerados), a
# configuração validada do paper (§3.1); power_law = rank^(−α) é a
# alternativa do repo (o paper não fixa α; 1,0 é o default dele).
# Substitui o 70/20/10 fixo do driver quando ligada.
parent_sampling: "off"
parent_lambda: 10.0
parent_alpha: 1.0
# Novidade Tier 1 com proxy LOCAL (sem embedding externo): AST
# normalizado do EVOLVE-BLOCK + similaridade difflib contra a
# subpopulação da ilha. O limiar é da escala DESTE proxy — NÃO é
# o 0,95 do paper (embedding); calibrar com a taxa de rejeição
# logada nas primeiras corridas com a flag ligada. O Tier 2 (juiz
# LLM) e o bandit de modelos NÃO foram portados (adiados pelo
# estudo; o bandit exige ≥2 rotas vivas provadas).
novelty_filter: false
novelty_threshold: 0.98

# Ensemble barato com teto executado por max_iterations: primário
# rápido/barato na maioria das mutações, forte como tempero.
# Trocar os modelos por qualquer endpoint OpenAI-compatible.
# Secundário = gemini-3.8-flash desde a emenda pós-V8 (o 3.5-flash
# foi depreciado em 08/10/2026 e roteado silenciosamente para o
# 3.6; a pesquisa do mutador é docs/PESQUISA-MUTADOR-FORGE-V1.md
# §4): o salto tem que ser salto — e nomeado, nunca trocado em
# silêncio.
# O driver da casa (forge/run.py + forge/llm_mutator.py) usa estes
# mesmos modelos/pesos. Cadeia de rotas (emenda de provedor de
# 27/10/2026, pós-429 da Version 7; cadeia revista na emenda
# pós-V8; IDs revistos na emenda de catálogo de 28/10/2026):
# NVIDIA NIM na frente (deepseek-v4.1-flash + fallback
# nemotron-3-ultra-550b-a55b), depois o par Gemini, depois o par Groq
# como fallback final — o ensemble roda com qualquer subconjunto
# das três chaves. O transporte tem ritmo
# (FORGE_LLM_MIN_INTERVAL_S, default 1,5s) + retry com
# backoff 5s/20s em 429/5xx.
llm:
  main_provider: "nvidia"
  main_model: "deepseek-ai/deepseek-v4.1-flash"
  main_api_base: "https://integrate.api.nvidia.com/v1"
  primary_model: "gemini-3-flash-preview"
  primary_model_weight: 0.8
  secondary_model: "gemini-3.8-flash"
  secondary_model_weight: 0.2
  api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  temperature: 0.7
  max_tokens: 16000
  timeout: 180

prompt:
  system_message: >
    You are evolving the decision policy of ONE autonomous company in a
    simulated world economy (Path to Quantum). The program defines
    EvolvedPolicy.decide(self, obs), which receives ONLY an Observation
    (obs.me = the company itself, obs.world = public state) and RETURNS
    a list of declarative intentions from mundo.intentions (Spend,
    Probe, RegisterClaim, BuildFacility, Narrate, NoteLink,
    RepairFacility, MaintainFacility, OverhaulFacility, Buy, Offer,
    SetTool); the engine validates and executes them in order.
    Decisions are planned against a Plan shadow (Plan.of(me): cash and
    facility kinds as they will be after the intentions declared so
    far). Everything else is inherited from the baseline heuristic and
    may be overridden inside the EVOLVE-BLOCK (reserve, pick_deposit,
    maintain_equipment, build_downstream, plan_buys, buffer,
    plan_sells, use_tools). Companies prospect and mine deposits,
    refine, build factories/plants/assembly up a production chain
    toward supercomputers, buy missing inputs, sell surplus and buy
    marketing tools. Fitness is the tournament index S (cash percentile
    50%, chain stage 30%, supercomputers 20%) of your company invading
    a frozen field of rivals. LEGAL information only: what the company
    probed (obs.me.knowledge), its own cash/stocks/facilities/traits,
    and public prices via obs.world. A guard rejects programs that
    import outside the allowlist (mundo, math), call eval/open/getattr,
    touch .rng, .companies or .act (there are no verbs to execute
    during a decision — declare intentions instead), or assign
    attributes on observed objects — rejected programs score 0 and
    the violations come back as artifacts. Prefer strategies a human
    can read and name: legibility is a product requirement, not style.
    Read the block summary and chronicle highlights in the artifacts:
    they tell the story of why the parent won or lost each world.

database:
  population_size: 300
  archive_size: 100
  num_islands: 5
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  # Eixos comportamentais do MAP-Elites (métricas do avaliador):
  # profundidade vertical média e expansão física média — espécies
  # diferentes ocupam células diferentes do arquivo.
  feature_dimensions: ["stage_mean", "facilities_mean"]

evaluator:
  timeout: 1200
  cascade_evaluation: true
  # S de tela (stage1) para merecer o stage2 completo:
  cascade_thresholds: [0.45]
  parallel_evaluations: 4

diff_based_evolution: true
max_code_length: 40000
